name: Build Linux amd64 binary

on:
  push:
    branches:
      - 'feature/generic-tcp-forward*'
      - 'custom/**'
  workflow_dispatch:
    inputs:
      BRANCH:
        description: 'patch maintenance branch or commit; empty uses the selected workflow ref'
        type: string
      UPSTREAM_TAG:
        description: 'official stable vX.Y.Z tag; empty uses custom/manifest.json'
        type: string
      PATCH_REVISION:
        description: 'positive custom patch revision; empty uses custom/manifest.json'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOMEMLIMIT: '1GiB'
      NODE_OPTIONS: '--max-old-space-size=2048'
      CUSTOM_SOURCE: ${{ github.workspace }}/build/custom-source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.BRANCH || github.ref }}
          fetch-depth: 0

      - name: Validate release tooling
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s utils -p 'test_custom_release.py'

      - name: Prepare official tag and replay forwarding patch
        id: prepare
        env:
          UPSTREAM_TAG: ${{ inputs.UPSTREAM_TAG }}
          PATCH_REVISION: ${{ inputs.PATCH_REVISION }}
        shell: bash
        run: |
          args=(--destination "$CUSTOM_SOURCE")
          if [[ -n "$UPSTREAM_TAG" ]]; then args+=(--tag "$UPSTREAM_TAG"); fi
          if [[ -n "$PATCH_REVISION" ]]; then args+=(--revision "$PATCH_REVISION"); fi
          python3 utils/custom_release.py prepare "${args[@]}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.CUSTOM_SOURCE }}/go.mod
          cache-dependency-path: ${{ env.CUSTOM_SOURCE }}/go.sum

      - name: Apply missing upstream dependency fixes
        run: python3 utils/custom_release.py dependencies --source "$CUSTOM_SOURCE"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build embedded UI
        working-directory: ${{ env.CUSTOM_SOURCE }}
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --cwd ui install --frozen-lockfile --non-interactive --network-concurrency 4
          yarn --cwd ui build

      - name: Build and package Linux amd64 binary
        run: python3 utils/custom_release.py build --source "$CUSTOM_SOURCE" --destination build

      - name: Record source provenance
        run: |
          printf 'Upstream: %s (%s)\n\nPackage: %s\n' \
            '${{ steps.prepare.outputs.upstream_tag }}' '${{ steps.prepare.outputs.upstream_sha }}' \
            '${{ steps.prepare.outputs.version }}' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: koko-linux-amd64
          path: build/koko-*-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 30
